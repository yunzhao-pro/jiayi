<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>only_jiayi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{
  height:100%;
  overflow:hidden;
  font-family:serif;
}
/* ========== 第一页：固定不动 ========== */
#page1{
  position:fixed;
  inset:0;
  background-image: url("jiayi_one.jpg");
  background-size: cover;
  background-position: center;
  z-index:1;
}
.title-box{
  position:fixed;
  top:42%;
  left:20%;
  z-index:8;
  text-align:left;
}
.line{
  color:#f8ecec;
  opacity:0;
  margin:24px 0;
  text-shadow: 0 0 6px #fff, 0 0 12px rgba(255,255,255,0.4);
}
.line1{font-size:25px; animation: fadeIn 1.2s ease forwards 0.5s;}
.line2{font-size:35px; animation: fadeIn 1.2s ease forwards 1.2s;}
.line3{font-size:50px; letter-spacing:18px; animation: fadeIn 1.2s ease forwards 1.9s;}
/* ========== 第二页 初始在屏幕下方 ========== */
#page2{
  position:fixed;
  inset:0;
  background-image: url("jiayi_two.jpg");
  background-size: cover;
  background-position: center;
  z-index:5;
  transform: translateY(100%);
  transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
}
#page2.up{
  transform: translateY(0);
}
/* ========== 第三页 ========== */
#page3{
  position:fixed;
  inset:0;
  background-image: url("jiayi_three.jpg");
  background-size: cover;
  background-position: center;
  z-index:6;
  transform: translateY(100%);
  transition: transform 1s cubic-bezier(0.77, 0, 0.175, 1);
}
#page3.up{
  transform: translateY(0);
}
/* 页面内文字容器，复用line动画 */
.page-inner{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align:center;
  color:#f8ecec;
  text-shadow:0 0 6px rgba(0,0,0,0.5);
  width:90%;
}
.page-inner img{
  max-width: 100%;
  max-height: 60vh;
  object-fit: contain;
  border-radius:8px;
}
/* 逐行淡入关键帧（和首页完全一致） */
@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}
/* 重置动画类：用于每次翻页重新触发动画 */
.line-animate{
  opacity:0;
}
.line-animate.run1{animation: fadeIn 1.2s ease forwards 0.5s;}
.line-animate.run2{animation: fadeIn 1.2s ease forwards 1.2s;}
.line-animate.run3{animation: fadeIn 1.2s ease forwards 1.9s;}
/* ========== 花瓣 ========== */
.petal{
  position:fixed;
  color:#df8999;
  pointer-events:none;
  z-index:9;
}
@keyframes petalFall{
  0%{opacity:1; transform:translateY(-30px) translateX(0) rotate(0deg);}
  50%{transform:translateY(50vh) translateX(40px) rotate(180deg);}
  100%{opacity:0; transform:translateY(100vh) translateX(-40px) rotate(360deg);}
}
/* ========== 烟花画布 ========== */
#fireworks{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:7;
}
/* ========== 滑动提示通用样式 ========== */
.drag-tip{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  color:#f8ecec;
  font-size:14px;
  letter-spacing:3px;
  z-index:8;
  animation:floatTip 2s infinite ease-in-out;
}
@keyframes floatTip{
  0%,100%{transform:translateX(-50%) translateY(0); opacity:0.7;}
  50%{transform:translateX(-50%) translateY(8px); opacity:1;}
}
/* ========== ✨美化后的音乐按钮【右上方】 ========== */
#musicBtn{
  position:fixed;
  top:24px;
  right:24px;
  padding:12px 22px;
  font-size:15px;
  font-family:serif;
  border:none;
  border-radius:999px;
  background: linear-gradient(135deg,#f8c8d0,#ec97a8);
  color:#fff;
  cursor:pointer;
  z-index:10;
  transition:all 0.3s ease;
  box-shadow:0 4px 14px rgba(224,135,152,0.35);
  letter-spacing:1px;
}
#musicBtn:hover{
  background: linear-gradient(135deg,#f7b8c4,#e88297);
  transform:translateY(-3px);
  box-shadow:0 6px 20px rgba(224,135,152,0.5);
}
#musicBtn:active{
  transform:translateY(0);
}
</style>
</head>
<body>
<!-- 第一页 -->
<div id="page1">
  <div class="title-box">
     <div class="line line1">ONCE I DREAMT</div>
     <div class="line line2">SYMPHONY OF BEYOND</div>
     <div class="line line3">PHROLOVA</div>
  </div>
  <div class="drag-tip" id="tip1">▼ 向上滑动</div>
</div>
<!-- 第二页：逐行文字 + 底部提示 -->
<div id="page2">
  <div class="page-inner">
    <h2 class="line-animate run1">The leaves fly</h2>
    <p class="line-animate run2">happy birthday to you</p>
    <img src="liujiayi.jpg" alt="配图" class="line-animate run3">
  </div>
  <div class="drag-tip" id="tip2">▼ 继续上滑</div>
</div>
<!-- 第三页：逐行文字 + 新增图片 -->
<div id="page3">
  <div class="page-inner">
    <h2 class="line-animate run1">Finally</h2>
    <p class="line-animate run2">Best wish to you</p>
    <img src="liujiayi3.jpg" alt="第三页配图" class="line-animate run3">
  </div>
</div>
<!-- ✅补上烟花画布标签 -->
<canvas id="fireworks"></canvas>

<audio id="bgMusic" loop>
  <source src="musico.mp3" type="audio/mpeg">
</audio>
<button id="musicBtn">🎵 播放音乐</button>
<script>
const page2 = document.getElementById('page2');
const page3 = document.getElementById('page3');
const tip1 = document.getElementById('tip1');
const tip2 = document.getElementById('tip2');
let currentPage = 0; //0 page1,1 page2,2 page3
let isAnimating = false;
let startY = 0;
let isDragging = false;
// 重置页面文字动画，每次翻页执行
function resetPageAnim(pageDom){
  const items = pageDom.querySelectorAll('.line-animate');
  items.forEach(el=>{
    el.style.animation = 'none';
    el.offsetHeight; //触发重绘
    el.style.animation = '';
  })
}
const canvas = document.getElementById('fireworks');
const ctx = canvas.getContext('2d');
let fireworks = [];
let particles = [];
let fwRunning = false;
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);
class Firework{
  constructor(sx, sy, tx, ty){
    this.x = sx;
    this.y = sy;
    this.sx = sx;
    this.sy = sy;
    this.tx = tx;
    this.ty = ty;
    this.distanceToTarget = Math.hypot(tx - sx, ty - sy);
    this.distanceTraveled = 0;
    this.coordinates = [];
    this.coordinateCount = 3;
    while(this.coordinateCount--){
      this.coordinates.push([this.x, this.y]);
    }
    this.angle = Math.atan2(ty - sy, tx - sx);
    this.speed = 2;
    this.acceleration = 1.05;
    this.brightness = 50 + Math.random() * 20;
    this.hue = Math.random() * 360;
  }
  update(index){
    this.coordinates.pop();
    this.coordinates.unshift([this.x, this.y]);
    this.speed *= this.acceleration;
    const vx = Math.cos(this.angle) * this.speed;
    const vy = Math.sin(this.angle) * this.speed;
    this.distanceTraveled = Math.hypot(this.x + vx - this.sx, this.y + vy - this.sy);
    if(this.distanceTraveled >= this.distanceToTarget){
      createParticles(this.tx, this.ty, this.hue);
      fireworks.splice(index, 1);
    }else{
      this.x += vx;
      this.y += vy;
    }
  }
  draw(){
    ctx.beginPath();
    ctx.moveTo(this.coordinates[this.coordinates.length-1][0], this.coordinates[this.coordinates.length-1][1]);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
class Particle{
  constructor(x, y, hue){
    this.x = x;
    this.y = y;
    this.coordinates = [];
    this.coordinateCount = 5;
    while(this.coordinateCount--){
      this.coordinates.push([this.x, this.y]);
    }
    this.angle = Math.random() * Math.PI * 2;
    this.speed = Math.random() * 10 + 1;
    this.friction = 0.95;
    this.gravity = 1;
    this.hue = hue + (Math.random() * 40 - 20);
    this.brightness = 50 + Math.random() * 30;
    this.alpha = 1;
    this.decay = 0.008 + Math.random() * 0.01;
  }
  update(index){
    this.coordinates.pop();
    this.coordinates.unshift([this.x, this.y]);
    this.speed *= this.friction;
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed + this.gravity;
    this.alpha -= this.decay;
    if(this.alpha <= this.decay){
      particles.splice(index, 1);
    }
  }
  draw(){
    ctx.beginPath();
    ctx.moveTo(this.coordinates[this.coordinates.length-1][0], this.coordinates[this.coordinates.length-1][1]);
    ctx.lineTo(this.x, this.y);
    ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}
function createParticles(x, y, hue){
  let count = 80;
  while(count--){
    particles.push(new Particle(x, y, hue));
  }
}
function launchFirework(){
  const sx = canvas.width / 2 + (Math.random() * 200 - 100);
  const sy = canvas.height;
  const tx = Math.random() * canvas.width;
  const ty = Math.random() * canvas.height / 2 + 60;
  fireworks.push(new Firework(sx, sy, tx, ty));
}
function fireworkLoop(){
  if(!fwRunning) return;
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalCompositeOperation = 'lighter';
  let i = fireworks.length;
  while(i--){
    fireworks[i].draw();
    fireworks[i].update(i);
  }
  let j = particles.length;
  while(j--){
    particles[j].draw();
    particles[j].update(j);
  }
  requestAnimationFrame(fireworkLoop);
}
function startFireworks(){
  if(fwRunning) return;
  fwRunning = true;
  fireworkLoop();
  // 进入第三页后连续放几发烟花，然后停止
  let burst = 0;
  const burstTotal = 6;
  const timer = setInterval(()=>{
    launchFirework();
    burst++;
    if(burst >= burstTotal){
      clearInterval(timer);
      // 等粒子消散后关闭
      setTimeout(()=>{
        fwRunning = false;
        ctx.clearRect(0,0,canvas.width,canvas.height);
      }, 2000);
    }
  }, 500);
}
function goToPage(n){
  if(isAnimating) return;
  if(n < 0 || n > 2) return;
  isAnimating = true;
  currentPage = n;
  // 全部重置
  page2.classList.remove('up');
  page3.classList.remove('up');
  tip1.style.display = 'none';
  tip2.style.display = 'none';
  if(n === 0){
    tip1.style.display = 'block';
  }else if(n === 1){
    page2.classList.add('up');
    resetPageAnim(page2);
    tip2.style.display = 'block';
  }else if(n === 2){
    page2.classList.add('up');
    page3.classList.add('up');
    resetPageAnim(page3);
    // ✅恢复烟花触发：进到第三页延迟700ms燃放烟花
    setTimeout(startFireworks,700);
  }
  setTimeout(()=>{ isAnimating = false; }, 1000);
}
// ===== 鼠标滚轮 =====
window.addEventListener('wheel', (e)=>{
  e.preventDefault();
  if(isAnimating) return;
  if(e.deltaY > 0) goToPage(currentPage + 1);
  else goToPage(currentPage - 1);
},{passive:false});
// ===== 鼠标按住拖拽 =====
window.addEventListener('mousedown', (e)=>{
  startY = e.clientY;
  isDragging = true;
});
window.addEventListener('mousemove', (e)=>{
  if(!isDragging || isAnimating) return;
  const moveY = e.clientY - startY;
  if(currentPage === 0){
    // page1向下拖拽，拉出page2
    if(moveY > 0){
      page2.style.transition = 'none';
      page2.style.transform = `translateY(${100 - moveY/window.innerHeight*100}%)`;
    }
  }else if(currentPage === 1){
    if(moveY > 0){
      // page2继续向下拖，拉出page3
      page3.style.transition = 'none';
      page3.style.transform = `translateY(${100 - moveY/window.innerHeight*100}%)`;
    }else{
      // page2向上拖，退回page1
      page2.style.transition = 'none';
      page2.style.transform = `translateY(${ -moveY/window.innerHeight*100 }%)`;
    }
  }else if(currentPage === 2){
    // page3向上拖，退回page2
    if(moveY < 0){
      page3.style.transition = 'none';
      page3.style.transform = `translateY(${-moveY/window.innerHeight*100}%)`;
    }
  }
});
window.addEventListener('mouseup', ()=>{
  if(!isDragging) return;
  isDragging = false;
  const moveY = event.clientY - startY;
  page2.style.transition = 'transform 1s cubic-bezier(0.77,0,0.175,1)';
  page3.style.transition = 'transform 1s cubic-bezier(0.77,0,0.175,1)';
  page2.style.transform = '';
  page3.style.transform = '';
  if(moveY > 100) goToPage(currentPage + 1);
  else if(moveY < -100) goToPage(currentPage - 1);
  else goToPage(currentPage);
});
// ===== 手机触摸 =====
let touchStartY = 0;
window.addEventListener('touchstart', (e)=>{
  touchStartY = e.touches[0].clientY;
});
window.addEventListener('touchmove',(e)=>{
  e.preventDefault();
},{passive:false})
window.addEventListener('touchend', (e)=>{
  const moveY = e.changedTouches[0].clientY - touchStartY;
  if(moveY < -50) goToPage(currentPage + 1);
  else if(moveY > 50) goToPage(currentPage - 1);
});
// ===== 音乐 =====
const bgMusic = document.getElementById('bgMusic');
const musicBtn = document.getElementById('musicBtn');
musicBtn.onclick = function(){
  if(bgMusic.paused){
    bgMusic.play();
    musicBtn.innerText = "🎵 暂停音乐";
  }else{
    bgMusic.pause();
    musicBtn.innerText = "🎵 播放音乐";
  }
}
// ===== 花瓣 =====
function createPetal(){
  const petal = document.createElement('div');
  petal.className = 'petal';
  petal.innerHTML = '✿';
  const size = 15 + Math.random() * 20;
  const duration = 6 + Math.random() * 6;
  petal.style.fontSize = size + 'px';
  petal.style.left = Math.random()*100 + 'vw';
  petal.style.top = '-30px';
  petal.style.animation = `petalFall ${duration}s ease-in forwards`;
  document.body.appendChild(petal);
  setTimeout(()=>petal.remove(), duration*1000);
}
setInterval(createPetal, 800);
</script>
</body>
</html>
